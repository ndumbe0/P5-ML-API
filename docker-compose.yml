version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sepsis-api
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - ./model_metrics.json:/app/model_metrics.json
      - ./sepsis_model.joblib:/app/sepsis_model.joblib
      - ./scaler.joblib:/app/scaler.joblib
      - ./feature_columns.joblib:/app/feature_columns.joblib
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sepsis-frontend
    ports:
      - "127.0.0.1:8501:8501"
    env_file:
      - .env
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
